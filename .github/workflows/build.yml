name: Test and build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - run: npm run helper:build
        if: runner.os != 'Linux'
      - run: npm run test:helper
      - run: npm run check
      - run: npm test
      - run: npm run test:client
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:client
        if: runner.os == 'Linux'
      - run: npm run test:ui
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:ui
        if: runner.os == 'Linux'
  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: mac
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: windows-2025
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CDG_HELPER_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-guard-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-guard-*
          merge-multiple: true
          path: release-assets
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.zip *.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --title "Claude Desktop Guard $RELEASE_TAG" --notes "Windows x64 and macOS Apple Silicon / Intel. Amnezia VPN mode binds IPv4 sockets and encrypted DNS to your selected tunnel; local HTTP proxy mode remains available. Process-scoped timezone and Chromium language profiles; native language/region overrides on macOS. Exit pinning and reversible Desktop settings. Full device fingerprint masking is not provided. Unsigned / not notarized; account suspension prevention is not guaranteed." *.zip *.exe SHA256SUMS.txt
